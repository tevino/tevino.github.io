---
layout: base
---
<article class="post">

  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
    {%- if page.description -%}
      <p>{{ page.description }}</p>
    {%- endif -%}
    {%- include post-language-switch.html -%}
  </header>
  <div class="post-content">
    {{ content }}
  </div>

</article>
